<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Episodio al azar</title>
  </head>
  <body>
    <main class="television">
      <header class="cabinet-top">
        <h1>Episodio al azar</h1>
        <span class="model" aria-hidden="true">COLOR TV · 2000</span>
      </header>
      <div class="bezel">
      <div class="screen">
      <div class="screen-osd" aria-hidden="true"><span>CH 01</span><span>STEREO</span></div>
      <section class="series-card" aria-label="Serie actual">
        <span id="platform" class="eyebrow">NETFLIX · HBO MAX · DISNEY+</span>
        <h2 id="series">Buscando tu serie…</h2>
        <p id="rule">Como antes: poné la tele.<br>El capítulo es una sorpresa.</p>
      </section>
      <div id="result" class="result" hidden>
        <span id="season" class="eyebrow"></span>
        <h3 id="episode"></h3>
      </div>
      <p id="status" role="status" aria-live="polite">Conectando con la pestaña…</p>
      <div id="next-result" class="result" hidden>
        <span id="next-season" class="eyebrow"></span>
        <h3 id="next-episode"></h3>
      </div>
      <div class="screen-footer" aria-hidden="true"><span>SEÑAL DIGITAL</span><span>SP ▸</span></div>
      </div>
      </div>
      <section class="control-panel" aria-label="Controles del televisor">
      <div class="hardware-row" aria-hidden="true"><span class="brand">AZAR<span>VISION</span></span><span class="power-led"></span><span class="power-label">POWER</span><span class="speaker"></span></div>
      <button id="shuffle" type="button" disabled>Episodio al azar</button>
      <button id="continuous" class="secondary" type="button" disabled>Iniciar modo continuo</button>
      <button id="open" class="secondary" type="button" hidden>Abrir episodio elegido</button>
      </section>
      <footer id="playback-note">Se reproduce en el sitio con tu sesión.</footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
